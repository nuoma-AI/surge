[General]
loglevel = notify
ipv6 = true
test-timeout = 6
proxy-test-url = http://www.gstatic.com/generate_204
skip-proxy = localhost, *.local, injections.adguard.org, local.adguard.org, captive.apple.com, 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32, ::1/128, fe80::/10, fc00::/7, 2001:db8::/32, ::ffff:0:0/96, ff00::/8
allow-wifi-access = true
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
external-controller-access = surgepasswd@192.168.31.18:6170
exclude-simple-hostnames = true
http-listen = 0.0.0.0
socks5-listen = 0.0.0.0

[Proxy Group]
Proxy = select, "♻️ 自动选择", "🚀 手动选择", "🛟 备用线路", "🐟 漏网之鱼", DIRECT
主要机场 = select, policy-path=这里填写订阅地址, update-interval=86400, policy-regex-filter=^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量).)+$, include-all-proxies=0, no-alert=0, hidden=0
备用机场 = select, policy-path=这里填写订阅地址, update-interval=86400, policy-regex-filter=^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量).)+$, include-all-proxies=0
主力测速 = url-test, include-other-group=主要机场, interval=10800
备用测速 = url-test, include-other-group=备用机场, interval=10800
♻️ 自动选择 = fallback, 主力测速, 备用测速, url=http://www.gstatic.com/generate_204, interval=300
🚀 手动选择 = select, include-other-group="备用机场, 主要机场"
🛟 备用线路 = select, include-other-group=备用机场
🇭🇰 香港 = smart, include-other-group=主要机场, policy-regex-filter=港|🇭🇰|香港|HK|Hong
🇹🇼 台湾 = smart, include-other-group=主要机场, policy-regex-filter=台|台湾|TW|Tai
🇯🇵 日本 = smart, include-other-group=主要机场, policy-regex-filter=🇯🇵|日本|JP|Japan
🇸🇬 新加坡 = smart, include-other-group=主要机场, policy-regex-filter=坡|🇸🇬|新加坡|狮城|SG|Singapore
🇺🇸 美国 = smart, include-other-group=主要机场, policy-regex-filter=^(?!.*简哲商用).*(美|🇺🇸|美国|US|States|American), icon-url=https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/US.png
🇺🇸 美国家宽 = smart, include-other-group=主要机场, policy-regex-filter=^.*美国家宽.*$, include-all-proxies=0
🇩🇪 德国 = smart, include-other-group=主要机场, policy-regex-filter=德|德国|🇩🇪|DE|Deutschland
🇫🇷 法国 = smart, include-other-group=主要机场, policy-regex-filter=法|法国|🇫🇷|FR|France
🇳🇴 挪威 = smart, include-other-group=主要机场, policy-regex-filter=挪威|NO|Norway
🇳🇬 尼日利亚 = smart, include-other-group=主要机场, policy-regex-filter=尼日利亚|NG|Nigeria, include-all-proxies=0
